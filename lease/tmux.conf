# ddc tmux: keeps Claude Code's normal keys working through Windows Terminal -> ssh -> tmux.
# Prefix is Ctrl-\ (Claude Code itself uses Ctrl-b, Ctrl-a, Ctrl-g, Ctrl-r ...). Detach: Ctrl-\ d, or just close the tab.
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:extkeys:clipboard:focus:mouse'
set -s extended-keys on
set -s escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g history-limit 200000
set -g mouse on
set -g base-index 0
set -g renumber-windows on
set -g status-interval 5
set -g status-style 'bg=colour236,fg=colour250'
set -g status-left '#[fg=colour114]ddc #S #[default]'
set -g status-left-length 20
set -g status-right '#(cat /run/ddc/status-line 2>/dev/null)'
set -g status-right-length 90
# F2/F3 switch windows without the prefix (claude / workers / shell)
bind -n F2 previous-window
bind -n F3 next-window

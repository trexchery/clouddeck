name: Release

# On a version tag (vX.Y.Z): builds sdist + wheel on Linux, checks them, publishes to PyPI via Trusted Publishing (OIDC, no token) when the
# repository variable PYPI_PUBLISH is "true", then creates the GitHub release with the same files, SHA256SUMS and the CHANGELOG section.
# PyPI side: add a (pending) trusted publisher for project "clouddeck", owner "trexchery", repo "clouddeck", workflow "release.yml",
# environment "pypi"; give the GitHub environment "pypi" a required reviewer.  Until then leave PYPI_PUBLISH unset: the GitHub release
# is still created.  Later, run this workflow by hand on the tag (`gh workflow run release.yml --ref vX.Y.Z`): it uploads to PyPI the
# exact files attached to that GitHub release, after checking them against the release's SHA256SUMS.
# Tests are not re-run here: the tagged commit must be on main (checked below), and main is only advanced when CI is green.
# The private-word scan reads its patterns from the repository secret RELEASE_DENYLIST (one regex per line); --strict fails without it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag, package version and changelog agree; extract the release notes
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
          grep -qx "__version__ = \"$v\"" clouddeck/__init__.py || { echo "::error::clouddeck/__init__.py is not $v"; exit 1; }
          mkdir -p "$RUNNER_TEMP/meta"
          # the lines between "## [<v>]" and the next "## [" heading (or the link references at the end)
          awk -v h="## [$v]" 'index($0, "## [") == 1 { f = index($0, h) == 1; next } /^\[[^]]+\]: / { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/meta/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/meta/notes.md" || { echo "::error::CHANGELOG.md has no (or an empty) [$v] section"; exit 1; }
          cat "$RUNNER_TEMP/meta/notes.md"
      - name: The tagged commit is on main
        run: |
          # fetch-depth 0 already fetched every branch: no second fetch (it would need credentials on a private repo)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - name: Release hygiene (strict, tree + history)
        env:
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
        run: |
          printf '%s\n' "$RELEASE_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          CLOUDDECK_RELEASE_DENYLIST="$RUNNER_TEMP/denylist.txt" python scripts/release_check.py --strict
      # the wheel is bit-for-bit reproducible with SOURCE_DATE_EPOCH; the sdist is content-reproducible (tar/gzip timestamps differ)
      - name: Build and check
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist/*.whl dist/*.tar.gz
          (cd dist && sha256sum -- *) | tee "$RUNNER_TEMP/meta/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # kept apart from dist/: the PyPI action uploads everything in its directory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta
          path: ${{ runner.temp }}/meta/
          if-no-files-found: error

  pypi:
    needs: build
    # on the tag push after a successful build, or by hand on a tag whose GitHub release already exists
    if: ${{ !cancelled() && vars.PYPI_PUBLISH == 'true' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/clouddeck/
    permissions:
      contents: read
      id-token: write # Trusted Publishing; the only job with it
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The files of the existing GitHub release, checked against its SHA256SUMS
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dl
          (cd dl && sha256sum -c SHA256SUMS)
          mkdir dist && mv dl/*.whl dl/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, pypi]
    # after PyPI when it is enabled; on its own when the pypi job was skipped (PYPI_PUBLISH unset); never after a PyPI failure
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta
          path: meta/
      - name: Create the GitHub release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c ../meta/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* meta/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CloudDeck ${GITHUB_REF_NAME#v}" --notes-file meta/notes.md

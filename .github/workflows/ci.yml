name: CI

# Tests, lint, shellcheck and a wheel smoke test.  No secrets, no network beyond package installs, never touches Akash:
# the test suite runs against the built-in simulated provider and temp dirs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:  # lean on purpose: oldest and newest on Linux, Windows in between (the wheel job adds Windows site-packages)
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }  # the coverage cell
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') }}
        run: python -m pytest -p no:cacheprovider
      # one cell also measures coverage; `coverage report` fails below `fail_under` in pyproject.toml
      - name: Tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: |
          python -m pip install coverage==7.16.2
          python -m coverage run -m pytest -p no:cacheprovider
          python -m coverage report

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.1
      - name: ruff check
        run: ruff check .
      # code added by the release tooling is formatted; the existing code base is not (yet), so that part only warns
      - name: ruff format (release tooling, enforced)
        run: ruff format --check scripts tests/test_release_check.py
      - name: ruff format (everything else, advisory)
        run: ruff format --check --quiet . || echo "::warning title=ruff format::some files are not ruff-formatted (advisory only)"
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (warning and above), syntax, line endings
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          shellcheck -x -S warning -P lease lease/*.sh
          shellcheck -S warning jobremote/*.sh bin/clouddeck
          for f in lease/*.sh jobremote/*.sh; do bash -n "$f"; done
          if grep -lU $'\r' lease/*.sh jobremote/*.sh bin/clouddeck; then echo "::error::CRLF line endings in shell scripts"; exit 1; fi

  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Data files are inside the artifacts
        run: python scripts/check_dist.py dist/*.whl dist/*.tar.gz
      - name: Wheel contents and `python -m clouddeck.job` from a built wheel (the opt-in packaging test)
        run: |
          python -m pip install -e ".[dev]"
          CLOUDDECK_TEST_WHEEL=1 python -m pytest tests/test_packaging.py -p no:cacheprovider -q
      - name: Install the wheel in a clean venv and run it from another directory
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          BIN="$RUNNER_TEMP/venv/bin"; [ -d "$BIN" ] || BIN="$RUNNER_TEMP/venv/Scripts"
          "$BIN/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          # everything below is offline and confined to temp dirs (no config, no keys, simulated provider)
          export HOME="$RUNNER_TEMP/run/userhome" USERPROFILE="$RUNNER_TEMP/run/userhome" APPDATA="$RUNNER_TEMP/run/userhome/AppData" LOCALAPPDATA="$RUNNER_TEMP/run/userhome/Local"
          export DDC_STATE_DIR="$RUNNER_TEMP/run/state" DDC_SECRETS_DIR="$RUNNER_TEMP/run/secrets"
          "$BIN/ddc" --version
          "$BIN/ddc" --help
          "$BIN/clouddeck" --help
          "$BIN/clouddeck" providers
          "$BIN/clouddeck" status -p demo
          "$BIN/ddc" init
          "$BIN/python" -I -c "from clouddeck import controller as c; p = c.data_file('sdl.yaml.tmpl'); print(p); assert p.is_file() and 'site-packages' in str(p)"

  # one required check for branch protection: fails unless every job above passed
  ci-gate:
    if: ${{ always() }}
    needs: [test, lint, shellcheck, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

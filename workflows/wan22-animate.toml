# Wan 2.2 ANIMATE: character swap. The person in a DRIVING VIDEO is replaced by the character of a REFERENCE IMAGE ("replace": the character appears in the
# driving video's own scene, background and camera kept) or the reference character performs the driving motion in the reference image's own scene ("move").
# This is not ordinary text-to-video: it needs a reference image and a driving video. The prompt only describes the new character and the scene.
#   put the media in workflows/inputs/ (reference.png, driving.mp4) ; ddc job check workflows/wan22-animate.toml ; ddc job run workflows/wan22-animate.toml --approve-usd <limit>
# Pipeline (the one verified on A100/H100 boxes): DWPose body and hands + real face crops of the driver (not the template's face dots, which freeze expressions), SAM3 text
# tracking of the person (no click points), lightx2v 6-step distill + relight LoRAs, bf16 14B model. Long clips run in windows of 77 frames (72 new each), chained.
# 80 GB-class GPUs only (bf16 model, kept resident); the model downloads are about 44 GiB. Time and cost are ESTIMATED: earlier A100/H100 runs took about two minutes per window.
name = "wan22-animate"
runtime_hours = 3
max_cost_usd = 10.0               # worst case = 3 h x $3.20 cap = $9.60 <= $10.00
estimated_runtime_min = 25     # ESTIMATED, not measured: used to rank bids and time the lease
setup_estimate_s = 900         # ESTIMATED: model downloads + the install step on the stock image (a prebuilt image makes it shorter)
cold_boot_s = 300
idle_abort_s = 900
artifacts_dir = "outputs"
inputs = ["comfyui/install.sh", "comfyui/comfy_run.py", "inputs/reference.png", "inputs/driving.mp4"]    # the new character; the video whose person is replaced. Optional: "inputs/prompt.txt"
inputs_dest = "in"

[hardware]
cpu = 16
memory = "96Gi"
disk = "120Gi"
max_usd_hr = 3.20             # above the default $2/h per-lease ceiling this needs `max_price_usd_hr = 3.2` (or more) in config.toml, otherwise it is lowered to the ceiling
min_uptime = 0.95
[hardware.gpu]
units = 1
vendor = "nvidia"
models = ["a100:80Gi", "h100:80Gi", "pro6000we:96Gi", "pro6000se:96Gi"]   # any of these: the cheapest bid that has one wins (ids as shown by `ddc job hardware`)
min_vram_gi = 80

[image]
stock = "pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime@sha256:417bd75df6365104c283ea4c1651fb3530d9eb5a4c2fafa51943cff2a94e6385"
# prebuilt = "ghcr.io/OWNER/clouddeck-comfyui:0.42.1-1"   # optional, saves the install step at every start: see workflows/README.md ("Prebuilt image")
prebuilt_timeout_s = 300
apt = ["git", "libgl1", "libglib2.0-0"]     # installed at start only if the image lacks them

[env]
# ANIMATE_MODE = "replace"    # "replace" (Mix: the new character in the driving video's scene) or "move" (the new character in the reference image's scene)
# ANIMATE_PROMPT = "The character is dancing in the room."   # describe the NEW character and the scene; a prompt.txt in `inputs` also works
# ANIMATE_FRAMES = 300         # default: the whole driving clip, at most 300 frames
# ANIMATE_LONG_SIDE = 832      # the longer side of the output; the size follows the driving video's aspect (or set ANIMATE_WIDTH / ANIMATE_HEIGHT, multiples of 16)
# ANIMATE_FACE = "crops"       # "crops" (real face crops) or "dots" (the template's DWPose face dots)
# ANIMATE_MASK_TEXT = "person" # what SAM3 looks for in the driving video
# ANIMATE_STEPS = 6            # 6 steps, cfg 1 with the distill LoRA
# ANIMATE_UNET = "wan2.2_animate_14B_bf16.safetensors"   # another build of the model (e.g. an fp8 one for a smaller GPU) needs its own [[cache.item]]
# ANIMATE_SEED = 1             # default: random (printed and saved in out/*.json)

[cache]
# Models download in parallel the moment the box is up, resumable and sha256-verified, pinned to an immutable Hugging Face commit (44 GiB in total here).
# To serve them from your own store instead (faster and independent of Hugging Face), upload each file under its `path` and list the store:
# mirrors = ["https://models.example.com/mirror"]

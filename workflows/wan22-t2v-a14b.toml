[[step]]
name = "install"
needs = ["inputs"]            # install.sh is one of the uploaded inputs; it then runs while the models download
productive = false
run = "bash in/install.sh"

[[step]]
name = "generate"
needs = ["install", "inputs", "cache-umt5", "cache-vae", "cache-t2v-high", "cache-t2v-low", "cache-t2v-fast-high", "cache-t2v-fast-low"]
run = "python in/comfy_run.py wan22-t2v-a14b"
artifacts = ["out/*.mp4", "out/*.json"]

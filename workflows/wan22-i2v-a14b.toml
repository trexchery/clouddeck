# Wan 2.2 A14B image-to-video: ordinary generation with the two-expert 14B model (high-noise expert, then low-noise expert), fp8 weights.
# This is NOT the character-swap workflow: for replacing or animating a person from a driving video see wan22-animate.toml and scail2.toml.
#   ddc job check workflows/wan22-i2v-a14b.toml     then    ddc job run workflows/wan22-i2v-a14b.toml --approve-usd <limit>
# 832x480, 81 frames, 16 fps (5 s), 20 steps. WAN_FAST = "1" switches to the lightx2v 4-step LoRAs (4 steps, cfg 1): about 5x faster, a little less detail.
# Needs a start image: put it at workflows/inputs/start.png (or change the inputs list). 24 GB of VRAM is enough (ComfyUI keeps one expert resident). Everything below is ESTIMATED: nothing here was run on a rented box.
name = "wan22-i2v-a14b"
runtime_hours = 3
max_cost_usd = 6.0               # worst case = 3 h x $2.00 cap = $6.00 <= $6.00
estimated_runtime_min = 25     # ESTIMATED, not measured: used to rank bids and time the lease
setup_estimate_s = 600         # ESTIMATED: model downloads + the install step on the stock image (a prebuilt image makes it shorter)
cold_boot_s = 300
idle_abort_s = 900
artifacts_dir = "outputs"
inputs = ["comfyui/install.sh", "comfyui/comfy_run.py", "inputs/start.png"]    # the image the video starts from (any .png/.jpg/.webp; the only image uploaded is used)
inputs_dest = "in"

[hardware]
cpu = 8
memory = "64Gi"
disk = "90Gi"
max_usd_hr = 2.00             # above the default $2/h per-lease ceiling this needs `max_price_usd_hr = 2.0` (or more) in config.toml, otherwise it is lowered to the ceiling
min_uptime = 0.95
[hardware.gpu]
units = 1
vendor = "nvidia"
models = ["rtx3090:24Gi", "a10g:24Gi", "rtx4090:24Gi", "rtx5090:32Gi", "a100:80Gi", "h100:80Gi", "pro6000we:96Gi", "pro6000se:96Gi"]   # any of these: the cheapest bid that has one wins (ids as shown by `ddc job hardware`)
min_vram_gi = 24

[image]
stock = "pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime@sha256:417bd75df6365104c283ea4c1651fb3530d9eb5a4c2fafa51943cff2a94e6385"
# prebuilt = "ghcr.io/OWNER/clouddeck-comfyui:0.42.1-1"   # optional, saves the install step at every start: see workflows/README.md ("Prebuilt image")
prebuilt_timeout_s = 300
apt = ["git", "libgl1", "libglib2.0-0"]     # installed at start only if the image lacks them

[env]
# WAN_PROMPT = "The camera slowly pushes in while the character looks around, soft wind moves the clothes and hair, cinematic lighting."   # default; a prompt.txt in `inputs` also works
# WAN_FAST = "1"               # 4-step LoRAs
# WAN_WIDTH = 832              # multiples of 16
# WAN_HEIGHT = 480
# WAN_FRAMES = 81              # 4k+1
# WAN_FPS = 16
# WAN_STEPS = 20               # 4 with WAN_FAST
# WAN_SEED = 1                 # default: random (printed and saved in out/*.json)

[cache]
# Models download in parallel the moment the box is up, resumable and sha256-verified, pinned to an immutable Hugging Face commit (35 GiB in total here).
# To serve them from your own store instead (faster and independent of Hugging Face), upload each file under its `path` and list the store:
# mirrors = ["https://models.example.com/mirror"]
[[cache.item]]
name = "umt5"
dest = "comfy/models/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
url = "https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/123acf1cc74bccbb9bfff8ac1ee72edc08c2341d/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"

[[step]]
name = "install"
needs = ["inputs"]            # install.sh is one of the uploaded inputs; it then runs while the models download
productive = false
run = "bash in/install.sh"

[[step]]
name = "generate"
needs = ["install", "inputs", "cache-umt5", "cache-vae", "cache-i2v-high", "cache-i2v-low", "cache-i2v-fast-high", "cache-i2v-fast-low"]
run = "python in/comfy_run.py wan22-i2v-a14b"
artifacts = ["out/*.mp4", "out/*.json"]

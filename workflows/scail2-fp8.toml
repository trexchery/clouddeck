[[step]]
name = "install"
needs = ["inputs"]            # install.sh is one of the uploaded inputs; it then runs while the models download
productive = false
run = "bash in/install.sh"

[[step]]
name = "generate"
needs = ["install", "inputs", "cache-umt5", "cache-vae", "cache-clip-vision", "cache-lightx2v", "cache-sam3", "cache-scail2", "cache-dpo", "cache-relight"]
run = "python in/comfy_run.py scail2"
artifacts = ["out/*.mp4", "out/*.json"]

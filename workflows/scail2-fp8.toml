# SCAIL-2 (fp8): character animation by in-context conditioning, on native ComfyUI nodes. A REFERENCE IMAGE's character is animated with the motion of a
# DRIVING VIDEO ("animation"), or put in the driving video's place ("replacement", with the relight LoRA). SAM3 finds the people in both: no masks or skeletons to prepare.
# This is not ordinary text-to-video and not Wan Animate (see wan22-animate.toml): the prompt should be long and detailed, describing the character and the scene.
#   put the media in inputs/ (reference.png, driving.mp4) ; ddc job check scail2-fp8.toml ; ddc job run scail2-fp8.toml --approve-usd <limit>
# Turbo (default): 6 steps, cfg 1 with the lightx2v LoRA. Long clips run in segments of 81 frames (76 new each), colour-matched and chained.
# 32 GB and up: fp8 weights (16.5 GB), NOT verified on a rented box; the 80 GB spec (scail2.toml) is. Time and cost are ESTIMATED.
name = "scail2-fp8"
runtime_hours = 3
max_cost_usd = 10.0               # worst case = 3 h x $3.20 cap = $9.60 <= $10.00
estimated_runtime_min = 20     # ESTIMATED, not measured: used to rank bids and time the lease
setup_estimate_s = 800         # ESTIMATED: model downloads + the install step on the stock image (a prebuilt image makes it shorter)
cold_boot_s = 300
idle_abort_s = 900
artifacts_dir = "outputs"
inputs = ["comfyui/install.sh", "comfyui/comfy_run.py", "inputs/reference.png", "inputs/driving.mp4"]    # the character; the motion. Optional: "inputs/prompt.txt"
inputs_dest = "in"

[hardware]
cpu = 16
memory = "64Gi"
disk = "100Gi"
max_usd_hr = 3.20             # above the default $2/h per-lease ceiling this needs `max_price_usd_hr = 3.2` (or more) in config.toml, otherwise it is lowered to the ceiling
min_uptime = 0.95
[hardware.gpu]
units = 1
vendor = "nvidia"
models = ["rtx5090:32Gi", "a100:80Gi", "h100:80Gi", "pro6000we:96Gi", "pro6000se:96Gi"]   # any of these: the cheapest bid that has one wins (ids as shown by `ddc job hardware`)
min_vram_gi = 32

[image]
stock = "pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime@sha256:417bd75df6365104c283ea4c1651fb3530d9eb5a4c2fafa51943cff2a94e6385"
# prebuilt = "ghcr.io/OWNER/clouddeck-comfyui:0.42.1-1"   # optional, saves the install step at every start: see README.md ("Prebuilt image")
prebuilt_timeout_s = 300
apt = ["git", "libgl1", "libglib2.0-0"]     # installed at start only if the image lacks them

[env]
SCAIL_UNET = "wan2.1_14B_SCAIL_2_fp8_scaled.safetensors"
# SCAIL_MODE = "animation"      # "animation" (the reference character does the motion) or "replacement" (it takes the driving video's person's place; adds the relight LoRA)
# SCAIL_PROMPT = "A person is dancing."   # long and detailed works best; a prompt.txt in `inputs` also works
# SCAIL_FRAMES = 300            # default: the whole driving clip, at most 300 frames
# SCAIL_WIDTH = 896             # multiples of 32; default follows the driving video (896x512 or 512x896)
# SCAIL_HEIGHT = 512
# SCAIL_TURBO = "1"             # 0 = 40 steps, cfg 5, no distill LoRA (slower, more faithful)
# SCAIL_RELIGHT = 1.0           # relight LoRA strength (default 1.0 in replacement mode, 0 in animation)
# SCAIL_SEED = 1                # default: random (printed and saved in out/*.json)

[cache]
